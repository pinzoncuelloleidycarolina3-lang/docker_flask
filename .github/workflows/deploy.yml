name: CI/CD Pipeline - Test y Despliegue

on:
  push:
    branches:
      - master
      - feature/vulnerabilidades

jobs:

  # JOB 1: PRUEBAS Y SEGURIDAD DE CÓDIGO

  test:
    name: Ejecutar Pruebas
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install pytest bandit
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Escaneo de seguridad (bandit)
        run: bandit -r . -x ./venv -s B101

      - name: Ejecutar pruebas
        run: pytest test_app.py -v

  # JOB 2: BUILD, ESCANEO DE IMAGEN Y DEPLOY

  build-and-deploy:
    name: Construir y Desplegar
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Iniciar sesión en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Construir imagen (sin publicar aún)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: ${{ secrets.DOCKER_USERNAME }}/proyecto689:latest

      - name: Escanear imagen con Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKER_USERNAME }}/proyecto689:latest
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Publicar imagen en Docker Hub
        run: docker push ${{ secrets.DOCKER_USERNAME }}/proyecto689:latest


      - name: Desplegar en servidor cloud
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /home/ubuntu/docker_flask
            git pull
            docker compose down --remove-orphans
            docker builder prune -a -f
            docker compose pull
            docker compose up -d --build --remove-orphans

            echo "===== LOGS PROXY MANAGER ====="
            docker logs proxy-manager --tail 50
            echo "===== ESTADO CONTENEDORES ====="
            docker ps -a