name: Publicar Imagen en Docker Hub

on:
  push:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # Descarga el código del repositorio
      - name: Descargar código
        uses: actions/checkout@v3

      # Configura Docker Buildx
      - name: Configurar python
        uses: docker/setup-buildx-action@v3

      # Inicia sesión en Docker Hub
      - name: Iniciar sesión en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      # Construye y publica la imagen
      - name: Construir y publicar imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/proyecto689:latest

            # Despliega en el servidor cloud
        -name: Desplegar en servidor cloud
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /home/ubuntu/docker_flask
            git pull
            docker compose down
            docker compose pull
            docker compose up -d --build